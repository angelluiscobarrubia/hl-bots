# Continuous Deployment
#
# Runs after the CI workflow completes successfully on `main`.
# Pipeline stages:
#   1. build-backend   — build backend image, push to ghcr.io
#   2. build-frontend  — build frontend (nginx) image, push to ghcr.io
#   3. tag-release     — create a git tag with the project version
#
# Images are tagged with `latest` and the git SHA. Layer caching uses the
# GitHub Actions cache to speed up rebuilds.

name: CD

on:
  # Triggered only when the CI workflow finishes on the default branch.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Only one deployment at a time; cancel a newer run if one is in progress.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN needs write access to the package registry and to create tags.
permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build + push backend image to ghcr.io
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    # Only deploy when CI actually passed (not cancelled/failed).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tags/labels (latest + git SHA) from git metadata.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          # pyproject.toml/poetry.lock live at the repo root
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse GitHub Actions cache across runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build + push frontend image (nginx serving static files) to ghcr.io
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Tag the release with the project version from pyproject.toml
  # ---------------------------------------------------------------------------
  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read the version from pyproject.toml (e.g. 0.1.0 -> v0.1.0).
      - name: Extract project version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*= *"([^"]+)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Create the tag via the GitHub API (avoids needing a PAT for git push).
      - name: Create git tag
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.VERSION;
            const ref = `refs/tags/v${version}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
              });
              console.log(`Created tag ${ref}`);
            } catch (error) {
              // Tag already exists (e.g. re-run) — treat as success.
              if (error.status === 422) {
                console.log(`Tag ${ref} already exists, skipping.`);
              } else {
                throw error;
              }
            }
        env:
          VERSION: ${{ steps.version.outputs.version }}
